<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fundo azul escuro -->
  <rect width="512" height="512" fill="#041F5A"/>
  
  <!-- Borda com detalhe em dourado -->
  <rect x="16" y="16" width="480" height="480" fill="none" stroke="#C89B3C" stroke-width="8" rx="60"/>
  
  <!-- Texto MT em dourado -->
  <text x="256" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="240" font-weight="bold" fill="#C89B3C" text-anchor="middle" dominant-baseline="middle">MT</text>
  
  <!-- Detalhe inferior em dourado (elemento decorativo) -->
  <circle cx="256" cy="420" r="16" fill="#C89B3C"/>
  <line x1="210" y1="420" x2="302" y2="420" stroke="#C89B3C" stroke-width="5" stroke-linecap="round"/>
</svg>
